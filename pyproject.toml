[project]
name = "kcdice"
version = "0.1.0"
description = "A Farkle-style dice game for the terminal"
readme = "README.md"
requires-python = ">=3.13.3"
dependencies = []

[project.scripts]
kcdice = "kcdice.cli:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
